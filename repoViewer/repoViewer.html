        if (!state.lightboxShots.length) return;
        const length = state.lightboxShots.length;
        state.lightboxIndex = (state.lightboxIndex + delta + length) % length;
        lightboxImage.src = state.lightboxShots[state.lightboxIndex];
      }

      function renderPagination() {
        const totalPages = Math.ceil(state.filteredApps.length / state.pageLength) || 1;
        if (totalPages <= 1) {
          pagination.innerHTML = state.filteredApps.length
            ? `<span>Page 1 / 1 · ${state.filteredApps.length} apps</span>`
            : "";
          return;
        }
        pagination.innerHTML = `
          <button type="button" data-page="${state.currentPage - 1}" ${state.currentPage === 1 ? "disabled" : ""}>Previous</button>
          <span>Page ${state.currentPage} / ${totalPages}</span>
          <button type="button" data-page="${state.currentPage + 1}" ${state.currentPage === totalPages ? "disabled" : ""}>Next</button>`;
      }

      function changePage(page) {
        const totalPages = Math.ceil(state.filteredApps.length / state.pageLength) || 1;
        if (page < 1 || page > totalPages) return;
        state.currentPage = page;
        renderApps();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      function filterApps() {
        refreshAppList(true);
      }

      function openAppFromId(bundleId) {
        setActiveView("apps");
        const app = state.apps.find(item => appIdentifier(item) === bundleId);
        if (!app) return;
        openAppModal(bundleId);
      }

      document.querySelectorAll(".viewTab").forEach(tab => {
        tab.addEventListener("click", () => setActiveView(tab.dataset.view));
      });

      repoInfo.addEventListener("click", event => {
        const chip = event.target.closest(".repoChip.clickable");
        if (!chip) return;
        toggleGlobalRepoFilter(chip.dataset.repo);
      });

      repoDetailContainer.addEventListener("click", event => {
        const openApp = event.target.closest("[data-open-app]");
        if (openApp) {
          openAppFromId(openApp.dataset.openApp);
        }
      });

      appContainer.addEventListener("click", event => {
        const repoLink = event.target.closest(".repoLink");
        if (repoLink) {
          event.stopPropagation();
          toggleCardRepoFilter(repoLink.dataset.bundleId, repoLink.dataset.repo);
          return;
        }

        const detailsBtn = event.target.closest(".detailsBtn");
        if (detailsBtn) {
          event.stopPropagation();
          openAppModal(detailsBtn.dataset.bundleId);
          return;
        }

        if (
          event.target.closest(".download") ||
          event.target.closest(".versionSelect") ||
          event.target.closest(".versionRow")
        ) {
          event.stopPropagation();
          return;
        }

        const card = event.target.closest(".card");
        if (card) {
          openAppModal(card.dataset.bundleId);
        }
      });

      appContainer.addEventListener("change", event => {
        if (!event.target.classList.contains("versionSelect")) return;
        const card = event.target.closest(".card");
        if (!card) return;
        const bundleId = card.dataset.bundleId;
        const app = state.apps.find(item => appIdentifier(item) === bundleId);
        if (!app) return;
        const view = getAppView(app, getEffectiveRepoFilter(app));
        const selected = view.versions[event.target.value];
        updateCardForVersion(card, selected);
      });

      modalBody.addEventListener("click", event => {
        const shot = event.target.closest("[data-shot-index]");
        if (!shot) return;
        let shots = [];
        try {
          shots = JSON.parse(appModal.dataset.shots || "[]");
        } catch (error) {
          shots = [];
        }
        openLightbox(shots, Number(shot.dataset.shotIndex) || 0);
      });

      modalClose.addEventListener("click", closeAppModal);
      appModal.addEventListener("click", event => {
        if (event.target === appModal) closeAppModal();
      });

      lightboxClose.addEventListener("click", closeLightbox);
      lightboxPrev.addEventListener("click", () => stepLightbox(-1));
      lightboxNext.addEventListener("click", () => stepLightbox(1));
      lightbox.addEventListener("click", event => {
        if (event.target === lightbox) closeLightbox();
      });

      pagination.addEventListener("click", event => {
        const button = event.target.closest("button[data-page]");
        if (!button || button.disabled) return;
        changePage(Number(button.dataset.page));
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (lightbox.classList.contains("open")) {
            closeLightbox();
            return;
          }
          if (appModal.classList.contains("open")) closeAppModal();
        }
        if (!lightbox.classList.contains("open")) return;
        if (event.key === "ArrowLeft") stepLightbox(-1);
        if (event.key === "ArrowRight") stepLightbox(1);
      });

      toggleHeader.addEventListener("click", () => {
        setHeaderCollapsed(!state.headerCollapsed);
      });

      searchBox.addEventListener("input", () => {
        syncSearchInputs(searchBox.value);
        filterApps();
      });

      searchBoxCompact.addEventListener("input", () => {
        syncSearchInputs(searchBoxCompact.value);
        filterApps();
      });

      categoryFilter.addEventListener("change", () => {
        syncCategoryFilter(categoryFilter.value);
        filterApps();
      });

      categoryFilterCompact.addEventListener("change", () => {
        syncCategoryFilter(categoryFilterCompact.value);
        filterApps();
      });

      developerFilter.addEventListener("change", () => {
        state.filters.developer = developerFilter.value;
        filterApps();
      });

      betaFilter.addEventListener("change", () => {
        state.filters.beta = betaFilter.value;
        filterApps();
      });

      featuredFilter.addEventListener("change", () => {
        state.filters.featured = featuredFilter.value;
        filterApps();
      });

      sortOrder.addEventListener("change", () => {
        state.filters.sort = sortOrder.value;
        filterApps();
      });

      clearFilters.addEventListener("click", resetFilters);

      pageLength.addEventListener("change", () => {
        state.pageLength = parseInt(pageLength.value, 10);
        syncPageLength(state.pageLength);
        state.currentPage = 1;
        renderApps();
      });

      pageLengthCompact.addEventListener("change", () => {
        state.pageLength = parseInt(pageLengthCompact.value, 10);
        syncPageLength(state.pageLength);
        state.currentPage = 1;
        renderApps();
      });

      restoreSources();
      restoreHeaderCollapsed();
      syncPageLength(state.pageLength);
      loadButton.addEventListener("click", loadRepositories);
    </script>
  </body>

</html>
